name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # publish.yml runs this whole workflow as its gate before uploading anything.
  workflow_call:

# Playwright is only used by the demo screenshots, with the Chrome already on
# the machine: there is nothing to download here.
env:
  PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        # The app runs on Node 20, but working on the repository needs 22.13+:
        # pnpm requires it, and the checks use node:sqlite.
        node: ['22']
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      # The checks were written on Windows, the primary platform: several
      # fixtures force `win32` while using real temp folders, so on Linux they
      # fail for reasons that aren't bugs in the app. Porting them is welcome.
      - run: pnpm check
        if: runner.os == 'Windows'
      - run: pnpm build

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:npm
      - name: Only the built files travel
        run: node .github/scripts/check-tarball.mjs
      - name: Pack what would be published
        run: npm pack --pack-destination "$GITHUB_WORKSPACE"
        working-directory: dist-npm
      - uses: actions/upload-artifact@v4
        with:
          name: tarball
          path: agent-workbench-*.tgz
          if-no-files-found: error

  # The package as a user gets it, on the three systems and on the oldest Node
  # it promises: it installs (node-pty is downloaded or compiled there), the
  # pseudo-terminal spawns a process, and the server starts and guards its door.
  smoke:
    name: Install and start · Node ${{ matrix.node }} on ${{ matrix.os }}
    needs: package
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # No pnpm here on purpose: this job only has what a user has.
          package-manager-cache: false
      - uses: actions/download-artifact@v4
        with:
          name: tarball
      - name: Install the tarball and start the app
        shell: bash
        run: node .github/scripts/smoke.mjs agent-workbench-*.tgz

  # The Android app: its JVM tests and a debug APK (not signed for publishing).
  # It lives in android/, outside the pnpm workspace; nothing of it reaches the
  # npm package.
  android:
    name: Android app
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5
      # A pull request could swap the wrapper JAR for anything: check it's Gradle's.
      - uses: gradle/actions/wrapper-validation@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Android SDK packages the build uses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;35.0.0" > /dev/null
      - name: Tests, lint and the debug APK
        run: ./gradlew --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
